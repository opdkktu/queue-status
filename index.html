function getCurrentMinutes(){

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );

}


function getDayStartMinutes(){

  return (
    DAY_START_HOUR * 60 +
    DAY_START_MINUTE
  );

}


function getNightStartMinutes(){

  return (
    NIGHT_START_HOUR * 60 +
    NIGHT_START_MINUTE
  );

}

   TRUE = PRIMA should be running

   07:00 → 17:20 = DAY
   17:20 → 07:00 = NIGHT
*/

  const minutes =
    getCurrentMinutes();

  return (
    minutes >= getDayStartMinutes() &&
    minutes < getNightStartMinutes()
  );

/* ============================================================
   RECORDING TIME
============================================================ */

function isRecordingTime(){

  /*
     Recording is NEVER allowed
     during night mode.
  */

  if(!currentDayMode){

    return false;

  }


  const now =
    new Date();


  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  /*
     Check all recording windows.
  */

  return RECORDING_WINDOWS.some(
    window => {

      const [
        startHour,
        startMinute
      ] =
        window.start
          .split(":")
          .map(Number);


      const [
        endHour,
        endMinute
      ] =
        window.end
          .split(":")
          .map(Number);


      const start =
        startHour * 60 +
        startMinute;


      const end =
        endHour * 60 +
        endMinute;


      return (
  currentMinutes >= start && 
 currentMinutes < end
);

    }
  );

}


/* ============================================================
   FORMAT DATE
============================================================ */

function pad(number){

  return String(number)
    .padStart(2,"0");

}


function formatDate(date){

  return (

    date.getFullYear() +

    "-" +

    pad(
      date.getMonth() + 1
    ) +

    "-" +

    pad(
      date.getDate()
    )

  );

}


function formatTime(date){

  return (

    pad(
      date.getHours()
    ) +

    ":" +

    pad(
      date.getMinutes()
    ) +

    ":" +

    pad(
      date.getSeconds()
    )

  );

}


/* ============================================================
   CREATE FILENAME
============================================================ */

function createRecordingFilename(
  startDate,
  endDate
){

  const date =
    formatDate(startDate);


  const start =
    pad(
      startDate.getHours()
    ) +
    pad(
      startDate.getMinutes()
    ) +
    pad(
      startDate.getSeconds()
    );


  const end =
    pad(
      endDate.getHours()
    ) +
    pad(
      endDate.getMinutes()
    ) +
    pad(
      endDate.getSeconds()
    );


  return (

    "PRIMA_" +
    date +
    "_" +
    start +
    "-" +
    end +
    ".webm"

  );

}

function getSupportedMimeType(){

  const types = [

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  for(
    const type of types
  ){

    if(
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      return type;

    }

  }


  return "";

}


/* ============================================================

  /*
     IMPORTANT:

     Canvas continues running while
     recording segments are changed.

     Therefore the camera/timestamp stream
     itself does NOT stop between files.
  */

  function drawFrame(){

    /*
       Canvas continues as long as
       recording system is active.
    */

    if(
      !recordingActive
    ){

      timestampAnimationFrame =
        null;

      return;

    }


    const ctx =
      recordingCanvasContext;


    /*
       Draw camera frame.
    */

    if(
      video.readyState >= 2
    ){

      ctx.drawImage(

        video,

        0,
        0,

        recordingCanvas.width,
        recordingCanvas.height

      );

    }


    /* ========================================================
       TIMESTAMP
    ======================================================== */

    const now =
      new Date();


    const timestamp =

      String(
        now.getDate()
      ).padStart(2,"0") +

      "/" +

      String(
        now.getMonth() + 1
      ).padStart(2,"0") +

      "/" +

      now.getFullYear() +

      " " +

      String(
        now.getHours()
      ).padStart(2,"0") +

      ":" +

      String(
        now.getMinutes()
      ).padStart(2,"0") +

      ":" +

      String(
        now.getSeconds()
      ).padStart(2,"0");


    ctx.font =
      "bold 18px Arial";


    const textWidth =
      ctx.measureText(
        timestamp
      ).width;


    const padding = 8;


    const x =
      recordingCanvas.width -
      textWidth -
      padding * 2 -
      10;


    const y =
      recordingCanvas.height -
      10;


    /*
       Timestamp background.
    */

    ctx.fillStyle =
      "rgba(0,0,0,0.65)";


    ctx.fillRect(

      x,

      y - 25,

      textWidth +
      padding * 2,

      25

    );


    /*
       Timestamp text.
    */

    ctx.fillStyle =
      "#ffffff";


    ctx.textBaseline =
      "middle";


    ctx.fillText(

      timestamp,

      x + padding,

      y - 12

    );


    /*
       Continue approximately 30 FPS.
    */

    timestampAnimationFrame =
      requestAnimationFrame(
        drawFrame
      );

  }


  /*
     Create canvas stream ONLY ONCE.
  */

  if(
    !recordingCanvasStream
  ){

    recordingCanvasStream =
      recordingCanvas.captureStream(
        30
      );

  }


  /*
     Start drawing.
  */

  if(
    !timestampAnimationFrame
  ){

    timestampAnimationFrame =
      requestAnimationFrame(
        drawFrame
      );

  }


  return recordingCanvasStream;

}
  /* ============================================================
   START ONE OVERLAPPING RECORDING SLOT
============================================================ */

function startRecordingSlot(slotName){

  const slot =
    recorderSlots[slotName];


  /*
     Don't start the same slot twice.
  */

  if(
    slot.active
  ){

    console.warn(
      "Recorder slot already active:",
      slotName
    );

    return;

  }


  /*
     Must be day mode.
  */

  if(
    !currentDayMode
  ){

    return;

  }


  /*
     Camera must exist.
  */

  if(
    !video.srcObject
  ){

    console.error(
      "Camera stream unavailable."
    );

    return;

  }


  /*
     Camera must be ready.
  */

  if(
    video.readyState < 2
  ){

    console.warn(
      "Camera video is not ready."
    );

    return;

  }


  /*
     Reuse continuous timestamp stream.
  */

  const timestampStream =
    createTimestampedVideoStream();


  const mimeType =
    getSupportedMimeType();


  /*
     Reset this slot.
  */

  slot.chunks =
    [];


  slot.startTime =
    new Date();


  try{

    slot.recorder =
      mimeType

        ?

        new MediaRecorder(
          timestampStream,
          {

            mimeType:
              mimeType,

            videoBitsPerSecond:
              VIDEO_BITRATE

          }
        )

        :

        new MediaRecorder(
          timestampStream
        );


  }catch(error){

    console.error(
      "MediaRecorder failed:",
      slotName,
      error
    );

    return;

  }


  /*
     Data collection.
  */

  slot.recorder.ondataavailable =
    event => {

      if(
        event.data &&
        event.data.size > 0
      ){

        slot.chunks.push(
          event.data
        );

      }

    };


  /*
     Finished.
  */

  slot.recorder.onstop =
    () => {

      finishRecordingSlot(
        slotName
      );

    };


  /*
     Error.
  */

  slot.recorder.onerror =
    event => {

      console.error(
        "MediaRecorder error:",
        slotName,
        event
      );

      slot.active =
        false;

    };


  /*
     Start recorder.
  */

  slot.recorder.start();


  slot.active =
    true;


  recordingActive =
    true;


  statusBox.textContent =
    "🔴 Recording";


  console.log(
    "================================="
  );


  console.log(
    "Recorder started:",
    slotName
  );


  console.log(
    "Start:",
    formatTime(
      slot.startTime
    )
  );


  console.log(
    "================================="
  );


  /*
     Stop this file after:

     2 minutes + 2 seconds.
  */

  slot.stopTimer =
    setTimeout(

      () => {

        if(
          slot.recorder &&
          slot.recorder.state ===
            "recording"
        ){

          console.log(
            "Stopping recorder:",
            slotName
          );


          slot.recorder.stop();

        }

      },

      RECORDING_FILE_DURATION_MS

    );

}
/* ============================================================
   FORCE STOP ALL RECORDERS
============================================================ */

function forceStopAllRecorders(){

  Object.values(
    recorderSlots
  ).forEach(
    slot => {

      if(
        slot.stopTimer
      ){

        clearTimeout(
          slot.stopTimer
        );

        slot.stopTimer =
          null;

      }


      if(
        slot.recorder &&
        slot.recorder.state ===
          "recording"
      ){

        try{

          slot.recorder.stop();

        }catch(error){

          console.error(
            "Recorder stop error:",
            error
          );

        }

      }

    }
  );


  /*
     Recording canvas can stop now.
  */

  recordingActive =
    false;

}
/* ============================================================
   FINISH ONE RECORDING SLOT
============================================================ */

function finishRecordingSlot(slotName){

  const slot =
    recorderSlots[slotName];


  /*
     Capture end time immediately.
  */

  const endDate =
    new Date();


  const startDate =
    slot.startTime ||
    new Date(
      endDate.getTime() -
      RECORDING_FILE_DURATION_MS
    );


  const filename =
    createRecordingFilename(
      startDate,
      endDate
    );


  /*
     Copy chunks immediately.

     This allows the same slot to
     be reused later.
  */

  const chunks =
    slot.chunks.slice();


  slot.chunks =
    [];


  /*
     MIME type.
  */

  const mimeType =
    slot.recorder &&
    slot.recorder.mimeType

      ?

      slot.recorder.mimeType

      :

      "video/webm";


  /*
     Create completed video.
  */

  const blob =
    new Blob(
      chunks,
      {
        type: mimeType
      }
    );


  console.log(
    "================================="
  );


  console.log(
    "Recording completed:",
    slotName,
    filename
  );


  console.log(
    "Video size:",
    (
      blob.size /
      1024 /
      1024
    ).toFixed(2) +
    " MB"
  );


  console.log(
    "================================="
  );


  /*
     Upload independently.

     IMPORTANT:
     Do NOT await.
  */

  uploadRecording(
    blob,
    filename
  ).catch(
    error => {

      console.error(
        "Background upload error:",
        error
      );

    }
  );


  /*
     Release slot.
  */

  slot.recorder =
    null;

  slot.startTime =
    null;

  slot.active =
    false;


  /*
     Overall recording state.
  */

  recordingActive =
    recorderSlots.A.active ||
    recorderSlots.B.active;


  if(
    currentDayMode
  ){

    statusBox.textContent =
      recordingActive
        ? "🔴 Recording"
        : "Recording finished";

  }

}

  async function sha256Hex( text ){

    const bytes = new TextEncoder().encode( text );

    const digest = await crypto.subtle.digest( "SHA-256", bytes );

    return Array.from( new Uint8Array( digest ) )
      .map( byte => byte.toString( 16 ).padStart( 2, "0" ) )
      .join( "" );

  }

  async function startCCTV(){

    /* CCTV only works during DAY MODE. */
    if( !currentDayMode ){ console.log( "CCTV not started: NIGHT MODE" ); return; }

    /* Camera must already be running. */
    if( !video.srcObject ){ console.warn( "CCTV cannot start: camera unavailable." ); return; }

    if( typeof Peer === "undefined" ){ console.warn( "CCTV cannot start: PeerJS library not loaded." ); return; }

    /* Don't create duplicate connections. */
    if( cctvPeer || cctvStarting ){ return; }

    cctvStarting = true;

    try{

      const iceServers = await getCCTVIceServers();

      /* Night mode may have started while we were waiting. */
      if( !currentDayMode || cctvPeer ){ return; }

      console.log( "Starting PRIMA CCTV..." );

      const peer = new Peer( CCTV_PEER_ID, { debug: 1, config: { iceServers } } );

      cctvPeer = peer;

      peer.on( "open", id => {
        cctvRestartDelay = 5000;
        console.log( "CCTV ready:", id );
      } );

      peer.on( "connection", handleCCTVConnection );

      /* Signalling lost: existing viewers keep streaming, we just re-register. */
      peer.on( "disconnected", () => scheduleCCTVReconnect( peer ) );

      peer.on( "close", () => handleCCTVPeerLost( peer ) );

      peer.on( "error", error => {

        console.warn( "CCTV peer error:", error.type );

        if( peer.destroyed ){ handleCCTVPeerLost( peer ); }
        else if( peer.disconnected ){ scheduleCCTVReconnect( peer ); }

      } );

    }catch( error ){

      console.error( "CCTV start error:", error );

      scheduleCCTVRestart();

    }finally{

      cctvStarting = false;

    }

  }

  function handleCCTVPeerLost( peer ){

  function scheduleCCTVRestart(){

  function scheduleCCTVReconnect( peer ){

      cctvReconnectTimer = null;

  /* ------------------------------------------------------------
     VIEWERS
  ------------------------------------------------------------ */

  function handleCCTVConnection( conn ){

    let authenticated = false;

    let attempts = 0;

    const send = message => {
      try{ conn.send( message ); }
      catch( error ){ console.warn( "CCTV send failed:", error ); }
    };

    const closeLater = ms => setTimeout( () => {
      try{ conn.close(); }catch( error ){}
    }, ms );

    /* Drop connections that never log in. */
    const authTimeout = setTimeout( () => {
      if( !authenticated ){ try{ conn.close(); }catch( error ){} }
    }, 20000 );

    conn.on( "data", async message => {

      if( authenticated || !message || message.type !== "auth" ){ return; }

      attempts++;

      const passOk =
        typeof message.pass === "string" &&
        message.pass.length > 0 &&
        message.pass.length <= 100 &&
        ( await sha256Hex( message.pass ) ) === CCTV_PASS_HASH;

      if( !passOk ){

        send( { type: "auth-failed" } );

        if( attempts >= 3 ){ closeLater( 500 ); }

        return;

      }

      if( !currentDayMode || !cctvPeer || !video.srcObject ){

        send( { type: "offline" } );

        return;

      }

      if( cctvViewers.size >= CCTV_MAX_VIEWERS && !cctvViewers.has( conn.peer ) ){

        send( { type: "busy" } );

        return;

      }

      authenticated = true;

      clearTimeout( authTimeout );

      send( { type: "auth-ok" } );

      /* IMPORTANT: reuse the EXISTING PRIMA camera. No second getUserMedia(). */
      const call = cctvPeer.call( conn.peer, video.srcObject );

      cctvViewers.set( conn.peer, { conn, call } );

      cctvActive = true;

      limitCCTVBitrate( call );

      call.on( "close", () => dropCCTVViewer( conn.peer ) );

      call.on( "error", () => dropCCTVViewer( conn.peer ) );

      console.log( "CCTV viewer connected:", conn.peer );

    } );

    conn.on( "close", () => {

      clearTimeout( authTimeout );

      const viewer = cctvViewers.get( conn.peer );

      if( viewer && viewer.conn === conn ){ dropCCTVViewer( conn.peer ); }

    } );

    conn.on( "error", error => console.warn( "CCTV data connection error:", error ) );

  }


  function dropCCTVViewer( id ){

    const viewer = cctvViewers.get( id );

    if( !viewer ){ return; }

    cctvViewers.delete( id );

    try{ viewer.call.close(); }catch( error ){}

    try{ viewer.conn.close(); }catch( error ){}

    cctvActive = cctvViewers.size > 0;

    console.log( "CCTV viewer disconnected:", id );

  }


  function dropAllCCTVViewers(){

    Array.from( cctvViewers.keys() ).forEach( dropCCTVViewer );

  }


  function limitCCTVBitrate( call ){

    const pc = call.peerConnection;

    if( !pc ){ return; }

    pc.addEventListener( "connectionstatechange", () => {

      if( pc.connectionState !== "connected" ){ return; }

      pc.getSenders().forEach( sender => {

        if( !sender.track || sender.track.kind !== "video" ){ return; }

        try{

          const params = sender.getParameters();

          if( !params.encodings || !params.encodings.length ){ params.encodings = [ {} ]; }

          params.encodings[0].maxBitrate = CCTV_MAX_BITRATE_KBPS * 1000;

          sender.setParameters( params ).catch( () => {} );

        }catch( error ){

          console.warn( "CCTV bitrate limit failed:", error );

        }

      } );

    } );

  }

  function waitForAudioEnd( audioElement ){

    /* Also resolves on error / pause / timeout, so a missing or
       blocked audio file can never freeze the announcement. */

    return new Promise(resolve => {

      const events = [ "ended", "error", "pause" ];

      let timer = null;

      const finished = () => {

        clearTimeout( timer );

        events.forEach( name => audioElement.removeEventListener( name, finished ) );

        resolve();

      };

      events.forEach( name => audioElement.addEventListener( name, finished ) );

      timer = setTimeout( finished, 120000 );

    });

  }

     "ended", "pause", "error", "play-failed" or "timeout". */

  function playAudioToEnd( audioElement, maxMs = 120000 ){

    return new Promise( resolve => {

      const events = [ "ended", "error", "pause" ];

      let finishedAlready = false;

      let timer = null;

      const finish = reason => {

        if( finishedAlready ){ return; }

        finishedAlready = true;

        clearTimeout( timer );

        events.forEach( name => audioElement.removeEventListener( name, onEvent ) );

        resolve( reason );

      };

      const onEvent = event => finish( event.type );

      events.forEach( name => audioElement.addEventListener( name, onEvent ) );

      timer = setTimeout( () => finish( "timeout" ), maxMs );

      audioElement.currentTime = 0;

      audioElement.play().catch( error => {

        console.error( "QR audio playback failed:", error );

        finish( "play-failed" );

      } );

    } );

  }


  async function playQrAnnouncement(){

    if( !currentDayMode || qrAnnouncementActive || announcementActive ){ return; }

    qrAnnouncementActive = true;

    console.log( "QR ANNOUNCEMENT STARTED" );

    /* Stop the normal welcome function (human detection is paused
       automatically while qrAnnouncementActive is true). */

    try{ audio.pause(); audio.currentTime = 0; }
    catch( error ){ console.error( error ); }

    welcomeScreen.classList.remove( "show" );

    showingWelcome = false;

    triggered = false;

    scanArrow.classList.add( "announcementHidden" );

    qrAnnouncementScreen.classList.add( "show" );

    statusBox.textContent = "📱 Imbas QR";

    const result = await playAudioToEnd( scanQrAudio );

    /* scanqr.mp3 missing or blocked: keep the QR visible for a fixed time. */

    if( result === "play-failed" || result === "error" ){ await delay( QR_FALLBACK_MS ); }

    /* Night mode already cleaned everything up. */

    if( !currentDayMode ){ qrAnnouncementActive = false; return; }

    /* Back to normal function. */

    qrAnnouncementScreen.classList.remove( "show" );

    scanArrow.classList.remove( "announcementHidden" );

    qrAnnouncementActive = false;

    statusBox.textContent = recordingActive ? "🔴 Recording" : "Ready for next visitor";

    console.log( "QR ANNOUNCEMENT FINISHED" );

  }


  function qrAnnouncementScheduler(){

    if( !currentDayMode || qrAnnouncementActive || announcementActive ){ return; }

    const now = new Date();

    const currentTime = pad( now.getHours() ) + ":" + pad( now.getMinutes() );

    if( !QR_ANNOUNCEMENT_TIMES.includes( currentTime ) ){ return; }

    const key = formatDate( now ) + "_" + currentTime;

    if( key === lastQrAnnouncementKey ){ return; }

    lastQrAnnouncementKey = key;

    playQrAnnouncement();

  }

  setInterval( qrAnnouncementScheduler, 1000 );


  /* ============================================================
  KEEP SCREEN AWAKE
  ============================================================ */

  /* Screen Wake Lock keeps the display on (black screen at night),
     so nobody has to switch it on in the morning. The browser can
     drop the lock (tab hidden, reload), so it is re-requested here. */

  async function requestWakeLock(){

    if( !( "wakeLock" in navigator ) ){

      console.warn( "Screen Wake Lock is not supported on this browser." );

      return;

    }

    if( wakeLock && !wakeLock.released ){ return; }

    try{

      wakeLock = await navigator.wakeLock.request( "screen" );

      wakeLock.addEventListener( "release", () => console.log( "Screen wake lock released." ) );

      console.log( "Screen wake lock active." );

    }catch( error ){

      console.warn( "Screen wake lock failed:", error );

    }

  }


  /* Every 30 minutes: re-acquire the lock and, at night, show a dim
     clock for 10 seconds, then return to the black empty screen. */

  function keepScreenAwake(){

    requestWakeLock();

    if( currentDayMode ){ return; }

    nightPulse.textContent = new Date().toLocaleTimeString( "en-GB", { hour: "2-digit", minute: "2-digit" } );

    nightPulse.classList.add( "on" );

    setTimeout( () => nightPulse.classList.remove( "on" ), NIGHT_PULSE_MS );

  }

  document.addEventListener( "visibilitychange", () => {

    if( document.visibilityState === "visible" ){ requestWakeLock(); }

  } );

  setInterval( keepScreenAwake, KEEP_AWAKE_INTERVAL_MS );
  /* ============================================================
   DARAH AUDIO SCHEDULER
   Sunday – Wednesday
   07:50 and 07:52
   Active window: 07:40 – 07:59
============================================================ */

const DARAH_TIMES = ["07:50","07:51","07:52","07:53","07:54","07:55","07:56","07:57","07:58","07:59","08:01"];

let lastDarahKey = "";
function isDarahDay(){
  const day =
    new Date().getDay();

  /*
     JavaScript:
     Sunday    = 0
     Monday    = 1
     Tuesday   = 2
     Wednesday = 3
     Thursday  = 4
     Friday    = 5
     Saturday  = 6
  */

  return (
    day >= 0 &&
    day <= 3
  );

}
async function playDarah(){
  /*
     Never play during night mode.
  */
  if(!currentDayMode){
    return;
  }
  /*
     Sunday – Wednesday only.
  */

  if(!isDarahDay()){
    return;
  }

  try{

    darahAudio.pause();

    darahAudio.currentTime = 0;

    await darahAudio.play();

    console.log(
      "🩸 darah.mp3 played"
    );

  }catch(error){

    console.error(
      "Darah audio playback failed:",
      error
    );

  }

}


function darahScheduler(){

  /*
     Don't process during night mode.
  */

  if(!currentDayMode){
    return;
  }

  /*
     Sunday – Wednesday only.
  */

  if(!isDarahDay()){
    return;
  }

  const now =
    new Date();

  const hours =
    String(
      now.getHours()
    ).padStart(2,"0");

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const currentTime =
    hours + ":" + minutes;

  /*
     Only allow 07:40 – 07:59.
  */

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();

  const windowStart =
    7 * 60 + 40;

  const windowEnd =
    7 * 60 + 59;

  if(
    currentMinutes <
      windowStart ||
    currentMinutes >
      windowEnd
  ){
    return;
  }

  /*
     Play at exactly:
     07:50
     07:52
  */

  if(
    DARAH_TIMES.includes(
      currentTime
    )
  ){

    const darahKey =
      formatDate(now) +
      "_" +
      currentTime;

    /*
       Prevent the same audio
       from playing repeatedly
       during the same minute.
    */

    if(
      darahKey !==
      lastDarahKey
    ){

      lastDarahKey =
        darahKey;

      playDarah();

    }

  }

}


setInterval(
  darahScheduler,
  1000
);

/* ============================================================
   UPLOAD VIDEO
============================================================ */

async function uploadRecording(
  blob,
  filename
){

  if(
    !UPLOAD_URL
  ){

    console.warn(
      "Google Apps Script upload URL has not been configured."
    );

    return;

  }


  /*
     Upload is running independently.

     This flag is informational only.

     It MUST NOT prevent the next recording.
  */

  uploadInProgress =
    true;


  console.log(
    "Uploading:",
    filename
  );


  try{

    const base64 =
      await blobToBase64(
        blob
      );


    const payload = {

      filename:
        filename,

      mimeType:
        blob.type ||
        "video/webm",

      data:
        base64

    };


    const response =
      await fetch(

        UPLOAD_URL,

        {

          method:
            "POST",

          headers:{

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    const resultText =
      await response.text();


    console.log(
      "Upload response:",
      resultText
    );


    if(
      currentDayMode
    ){

      statusBox.textContent =
        recordingActive
          ? "🔴 Recording"
          : "Uploaded: " + filename;

    }


  }catch(error){

    console.error(
      "Upload failed:",
      filename,
      error
    );


    if(
      currentDayMode
    ){

      statusBox.textContent =
        recordingActive
          ? "🔴 Recording • Upload failed"
          : "Upload failed: " + filename;

    }

  }


  uploadInProgress =
    false;

}


/* ============================================================
   BLOB → BASE64
============================================================ */

function blobToBase64(
  blob
){

  return new Promise(

    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onloadend =
        () => {

          const result =
            reader.result;


          const base64 =
            result.split(",")[1];


          resolve(
            base64
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }

  );

}

/* ============================================================
   OVERLAP RECORDING SCHEDULER
============================================================ */

function recordingScheduler(){

  /*
     Never record at night.
  */

  if(
    !currentDayMode
  ){

    return;

  }


  /*
     Only record inside recording windows.
  */

  if(
    !isRecordingTime()
  ){

    return;

  }


  const now =
    new Date();


  /*
     We schedule based on the exact
     2-minute boundary.

     Example:

     07:10:00
     07:12:00
     07:14:00
     07:16:00
  */


  const seconds =
    now.getSeconds();


  const milliseconds =
    now.getMilliseconds();


  /*
     Only trigger near the exact
     beginning of a minute.
  */

  if(
    seconds !== 0 ||
    milliseconds > 900
  ){

    return;

  }


  /*
     Total minutes since midnight.
  */

  const totalMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  /*
     Find the matching recording window.
  */

  const activeWindow =
    RECORDING_WINDOWS.find(
      window => {

        const [
          startHour,
          startMinute
        ] =
          window.start
            .split(":")
            .map(Number);


        const startMinutes =
          startHour * 60 +
          startMinute;


        return (
          totalMinutes >=
          startMinutes
        );

      }
    );


  if(
    !activeWindow
  ){

    return;

  }


  /*
     Calculate minutes from the
     recording window start.
  */

  const [
    startHour,
    startMinute
  ] =
    activeWindow.start
      .split(":")
      .map(Number);


  const windowStartMinutes =
    startHour * 60 +
    startMinute;


  const minutesFromWindowStart =
    totalMinutes -
    windowStartMinutes;


  /*
     Only every 2 minutes.
  */

  if(
    minutesFromWindowStart %
    2 !== 0
  ){

    return;

  }


  /*
     Alternate recorder slots.

     Segment 0 → A
     Segment 1 → B
     Segment 2 → A
     Segment 3 → B
  */

  const segmentNumber =
    Math.floor(
      minutesFromWindowStart /
      2
    );


  const slotName =
    segmentNumber %
    2 === 0

      ?

      "A"

      :

      "B";


  /*
     Start only if free.
  */

  if(
    !recorderSlots[
      slotName
    ].active
  ){

    startRecordingSlot(
      slotName
    );

  }
}
setInterval(recordingScheduler, 1000);

/* ============================================================
   FACE DETECTION
============================================================ */

async function detectLoop(){

  /*
     Stop the animation loop completely
     when night mode starts.
  */

  if(
    !currentDayMode ||
    !detectionRunning
  ){

    return;

  }


  /*
     Human detection is paused during QR announcements
     and outside welcome hours (16:30 - 07:40).
  */

  const detectionAllowed = isDetectionAllowed();

  if(!detectionAllowed){
    triggered = false;
  }

  if(
    detector &&
    video.readyState >= 2 &&
    detectionAllowed
  ){

    try{

      const result =
        detector.detectForVideo(
          video,
          performance.now()
        );


      let closePerson = false;


      if(
        result.detections.length
      ){

        const box =
          result
            .detections[0]
            .boundingBox;


        const area =
          (
            box.width *
            box.height
          ) /
          (
            video.videoWidth *
            video.videoHeight
          );


        if(
          area > 0.08
        ){

          closePerson = true;

          lastSeen =
            Date.now();

        }

      }


      /*
         Visitor detection.
      */

      if(
        closePerson &&
        !triggered &&
        !showingWelcome &&
        !announcementActive
      ){

        playWelcome();

      }


      if(
        triggered
      ){

        if(
          Date.now() -
          lastSeen >
          2000
        ){

          triggered = false;


          if(currentDayMode){

            statusBox.textContent =
              recordingActive
              ?
              "🔴 Recording"
              :
              "Ready for next visitor";
          }
        }
      }

    }catch(error){
      /*
         Ignore individual AI frames.

         If the AI was closed because
         night mode started, simply exit.
      */

      if(currentDayMode){

        console.error(
          "Face detection error:",
          error
        );
      }
    }
  }

  /*
     Only continue while day mode
     is active.
  */
  if(
    currentDayMode &&
    detectionRunning
  ){
    requestAnimationFrame(
      detectLoop
    );
  }
}
/* ============================================================
   WELCOME TIME CONTROL
============================================================ */

function isWelcomeAllowed(){

  const now = new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();

  /* Welcome only between 07:40 and 16:30. */

  return (
    currentMinutes >= WELCOME_START_MINUTES &&
    currentMinutes < WELCOME_END_MINUTES
  );

}

function isDetectionAllowed(){

  return !qrAnnouncementActive && isWelcomeAllowed();

}
/* ============================================================
   WELCOME SCREEN
============================================================ */

async function playWelcome(){

  /*
     Never trigger during night mode.
  */

  if(!currentDayMode){

    return;

  }
 /*
     Stop welcome function after 4:30 PM.
     welcome.png and welcome.mp3
     will not be shown or played.
  */

  if(!isWelcomeAllowed()){
    return;
  }
  showingWelcome = true;
  triggered = true;
  statusBox.textContent =
    recordingActive
    ?
    "Visitor detected • 🔴 Recording"
    :
    "Visitor detected";
  welcomeScreen.classList.add(
    "show"
  );
  try{
    audio.currentTime = 0;
    await audio.play();
  }catch(err){
    console.log(
      "Audio playback blocked:",
      err
    );
  }
  setTimeout(()=>{
    welcomeScreen.classList.remove(
      "show"
    );
    showingWelcome = false;
  },5000);
}
/* ============================================================
   START EVERYTHING
============================================================ */
async function start(){

  /* Keep the display on (also overnight). */
  requestWakeLock();
  /*
     Determine the correct mode immediately.
     This is important.
     Example:
     Chrome starts at 10:00
     → DAY MODE
     Chrome starts at 19:00
     → NIGHT MODE
  */

  if(shouldBeDayMode()){
    currentDayMode = false;
    await enterDayMode();
  }else{
    /*
       We are starting outside
       operating hours.
       Don't initialise camera.
       Don't initialise AI.
    */
    currentDayMode = true;
    await enterNightMode();
  }
}
/* ============================================================
   START PRIMA
============================================================ */
start();
